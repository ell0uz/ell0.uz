<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07080d;
    --ink:#f4f6fa;
    --muted:rgba(244,246,250,.58);
    --faint:rgba(244,246,250,.30);
    --accent:#6ef3c5;
    --font-display:'Unbounded',ui-sans-serif,system-ui,-apple-system,sans-serif;
    --font-joke:'Instrument Serif',Georgia,'Times New Roman',serif;
    --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-display);
    overflow:hidden;
    display:grid;
    place-items:center;
    -webkit-font-smoothing:antialiased;
  }
  #bg{position:fixed;inset:0;z-index:0;display:block}
  .grain{
    position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/></svg>");
  }
  main{
    position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;
    gap:clamp(22px,4.5vh,44px);
    padding:0 24px;text-align:center;
  }
  .eyebrow{
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;
    max-width:min(90vw,60ch);text-align:center;
    font-family:var(--font-display);font-weight:500;
    font-size:clamp(.8rem,1.9vw,.98rem);
    letter-spacing:.04em;color:var(--muted);
    opacity:0;animation:fadeUp .8s ease .1s forwards;
  }
  .eyebrow .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 12px 2px rgba(110,243,197,.55);
    animation:pulse 2.6s ease-in-out infinite;
  }
  .domain{
    display:flex;user-select:none;cursor:default;
    font-weight:800;line-height:1;
    font-size:clamp(2.4rem,12vw,9rem);
    letter-spacing:-.02em;
    animation:floaty 7s ease-in-out infinite;
  }
  .ltr{
    display:inline-block;
    opacity:0;transform:translateY(48px) rotate(6deg);
    animation:rise .9s cubic-bezier(.2,.75,.25,1) forwards;
    animation-delay:calc(.25s + var(--i)*.065s);
    transition:transform .35s cubic-bezier(.2,.75,.25,1),color .3s ease,text-shadow .3s ease;
  }
  .ltr.settled{animation:none;opacity:1;transform:none}
  .ltr.settled:hover{
    transform:translateY(-10px);
    color:var(--accent);
    text-shadow:0 0 28px rgba(110,243,197,.45);
  }
  .tld .ltr{color:var(--accent)}
  .tld .ltr.settled:hover{color:var(--ink);text-shadow:0 0 28px rgba(244,246,250,.35)}
  .joke-wrap{
    display:flex;flex-direction:column;align-items:center;
    opacity:0;animation:fadeUp .9s ease 1s forwards;
  }
  .joke{
    font-family:var(--font-joke);font-style:italic;
    font-size:clamp(1.15rem,2.6vw,1.65rem);
    color:var(--muted);max-width:36ch;line-height:1.45;
    text-wrap:pretty;cursor:pointer;overflow:hidden;
    transition:opacity .45s ease,transform .45s ease,height .45s ease,color .3s ease;
  }
  .joke:hover{color:var(--ink)}
  .joke.swap{opacity:0;transform:translateY(12px)}
  .hint{
    margin-top:16px;
    font-family:var(--font-mono);font-size:.62rem;
    letter-spacing:.22em;text-transform:uppercase;color:var(--faint);
  }
  .foot{
    position:fixed;left:0;right:0;bottom:22px;z-index:2;
    text-align:center;pointer-events:none;
    font-family:var(--font-mono);font-size:.62rem;
    letter-spacing:.22em;text-transform:uppercase;color:var(--faint);
  }
  @keyframes rise{to{opacity:1;transform:translateY(0) rotate(0)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){
    .domain,.eyebrow,.joke-wrap,.eyebrow .dot{animation:none!important;opacity:1!important;transform:none!important}
    .ltr{animation:none!important;opacity:1!important;transform:none!important}
    .joke{transition:none}
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<main>
  <p class="eyebrow"><span class="dot"></span><span>personal domain</span></p>
  <h1 class="domain" aria-label="ell0.uz"><span class="ltr" style="--i:0">e</span><span class="ltr" style="--i:1">l</span><span class="ltr" style="--i:2">l</span><span class="ltr" style="--i:3">0</span><span class="tld"><span class="ltr" style="--i:4">.</span><span class="ltr" style="--i:5">u</span><span class="ltr" style="--i:6">z</span></span></h1>
  <div class="joke-wrap">
    <p class="joke" id="joke" role="button" tabindex="0" title="Click for another joke">Why do programmers prefer dark mode? Because light attracts bugs.</p>
    <span class="hint">click for another joke</span>
  </div>
</main>
<footer class="foot">© 2026 ell0.uz</footer>
<script>
(() => {
  const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- animated starfield background ---------- */
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, stars = [], meteors = [];
  const mouse = { x: 0.5, y: 0.5 };

  function seed() {
    const n = Math.min(260, Math.round((W * H) / 8000));
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 0.3 + Math.random() * 1.3,
      phase: Math.random() * Math.PI * 2,
      speed: 0.4 + Math.random() * 1.2,
      vx: (Math.random() - 0.5) * 0.06,
      vy: (Math.random() - 0.5) * 0.06,
      depth: 0.3 + Math.random() * 0.7,
      warm: Math.random() < 0.12
    }));
  }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed();
  }
  function spawnMeteor() {
    const dir = Math.random() < 0.5 ? 1 : -1;
    meteors.push({
      x: W * (0.15 + Math.random() * 0.7),
      y: Math.random() * H * 0.3,
      vx: dir * (6 + Math.random() * 5),
      vy: 3 + Math.random() * 2.5,
      life: 1
    });
  }
  let meteorTimer = 2200;
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    const px = mouse.x - 0.5, py = mouse.y - 0.5;
    for (const s of stars) {
      const tw = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.001 * s.speed + s.phase));
      ctx.globalAlpha = tw;
      ctx.fillStyle = s.warm ? '#ffd9a8' : '#e8ecf5';
      ctx.beginPath();
      ctx.arc(s.x + px * 26 * s.depth, s.y + py * 26 * s.depth, s.r, 0, Math.PI * 2);
      ctx.fill();
      if (!RM) {
        s.x += s.vx; s.y += s.vy;
        if (s.x < -4) s.x = W + 4; else if (s.x > W + 4) s.x = -4;
        if (s.y < -4) s.y = H + 4; else if (s.y > H + 4) s.y = -4;
      }
    }
    if (!RM) {
      meteorTimer -= 16;
      if (meteorTimer <= 0) { spawnMeteor(); meteorTimer = 3500 + Math.random() * 5500; }
    }
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.vx; m.y += m.vy; m.life -= 0.012;
      if (m.life <= 0 || m.y > H + 40) { meteors.splice(i, 1); continue; }
      const g = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 12, m.y - m.vy * 12);
      g.addColorStop(0, 'rgba(110,243,197,' + (0.9 * m.life).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(110,243,197,0)');
      ctx.globalAlpha = 1;
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - m.vx * 12, m.y - m.vy * 12);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (!RM) requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('pointermove', e => {
    mouse.x = e.clientX / Math.max(W, 1);
    mouse.y = e.clientY / Math.max(H, 1);
  });
  resize();
  requestAnimationFrame(draw);

  /* ---------- rotating joke, bottom of center ---------- */
  const jokes = [
    /* Delay the jokes thing */
    "",
    "Why do programmers prefer dark mode? Because light attracts bugs.",
    "I'd tell you a UDP joke, but you might not get it.",
    "There are 10 kinds of people: those who understand binary and those who don't.",
    "Why did the developer go broke? He used up all his cache.",
    "A SQL query walks into a bar, sees two tables and asks, \u201CMind if I join you?\u201D",
    "Parallel lines have so much in common. It's a shame they'll never meet.",
    "Best Pastebin alternative: bin.ell0.uz"
  ];
  const jokeEl = document.getElementById('joke');
  let ji = 0, timer = null;
  function next() {
    ji = (ji + 1) % jokes.length;
    const h0 = jokeEl.offsetHeight;          // height of the current joke
    jokeEl.classList.add('swap');             // fade/slide out
    setTimeout(() => {
      jokeEl.textContent = jokes[ji];
      const h1 = jokeEl.offsetHeight;        // natural height of the new joke
      jokeEl.classList.remove('swap');       // fade/slide in
      if (RM) return;
      // animate the height from old to new so line-count changes glide
      jokeEl.style.height = h0 + 'px';
      void jokeEl.offsetHeight;              // force reflow
      jokeEl.style.height = h1 + 'px';
      setTimeout(() => { jokeEl.style.height = ''; }, 500);  // release to auto
    }, 450);
  }
  function arm() {
    clearInterval(timer);
    if (!RM) timer = setInterval(next, 6000);
  }
  jokeEl.textContent = jokes[0];
  jokeEl.addEventListener('click', () => { next(); arm(); });
  jokeEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); arm(); }
  });
  arm();

  /* ---------- free the letters for hover after entrance ---------- */
  document.querySelectorAll('.ltr').forEach(el =>
    el.addEventListener('animationend', () => el.classList.add('settled'), { once: true })
  );
})();
</script>
</body>
</html>
