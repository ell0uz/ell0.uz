server {
  listen 80;
  server_name ell0.uz _;
  root /usr/share/nginx/html;
  index index.html;

  # don't serve compose/nginx config files
  location ~* \.(yaml|yml|conf)$ {
    return 404;
  }

  # self-hosted fonts: cache hard, compress on the fly (ttf compresses well)
  location ~* \.(ttf|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    gzip on;
    gzip_types font/ttf font/woff font/woff2 application/font-sfnt application/x-font-ttf application/font-woff application/font-woff2;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
